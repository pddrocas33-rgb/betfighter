    <style>

        .pdf-title { font-weight: 600; font-size: 0.9rem; color: #334155; display: flex; align-items: center; gap: 8px; }
        .pdf-item a { background: #0f172a; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 4px; font-weight: 700; font-size: 0.8rem; transition: background 0.2s; white-space: nowrap; }
