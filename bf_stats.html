    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCeSB_CWfsuo2QcJR2OM7piQwo8HhZ4fRQ",
            authDomain: "taskmeapp-c4951.firebaseapp.com",
            databaseURL: "https://taskmeapp-c4951-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "taskmeapp-c4951",
            storageBucket: "taskmeapp-c4951.firebasestorage.app",
            messagingSenderId: "965251565988",
            appId: "1:965251565988:web:0de5b7daa0f0566ebc5931",
            measurementId: "G-HTY2BGM9Y8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Parâmetros dinâmicos do Fight Selection / Value Bet
        window.minFsOdd = 1.99;
        window.minFsEdge = 0.10;
        window.minFsDiscrepancy = 0.15; // NOVO: Factor de Discrepância

        // Dicionário de Traduções
        const i18n = {
            pt: {
                back: "Voltar a Palpites",
                selDay: "Dia selecionado:",
                today: "Hoje",
                loading: "A carregar linhas...",
                statsNormais: "Apostas Normais (Simples)",
                statsFSAll: "Fighter Selected (Todas)",
                statsFSLow: "Low FS",
                statsFSMed: "Medium FS",
                statsFSHigh: "High FS",

                results: "Resultados Dia",
                resultsMonth: "Resultados Mês",
                win: "G",
                loss: "P",
                pend: "Pnd",
                dateND: "Data N/D",
                noGames: "Nenhum jogo nesta categoria para o dia selecionado.",
                viewGames: "Ver jogos",
                disclaimerNotice: "Plataforma informativa gratuita em fase de testes. As análises estatísticas não garantem lucros. Aposte com responsabilidade."
            },
            en: {
                back: "Back to Picks",
                selDay: "Selected day:",
                today: "Today",
                loading: "Loading lines...",
                statsNormais: "Normal Bets (Singles)",
                statsFSAll: "Fighter Selected (All)",
                statsFSLow: "Low FS",
                statsFSMed: "Medium FS",
                statsFSHigh: "High FS",
                roiDay: "Daily ROI",
                roiMonth: "Monthly ROI",
                avgOdd: "Avg Odd",
                profitDay: "Daily Profit (u)",
                results: "Daily Results",
                resultsMonth: "Monthly Results",
                win: "W",
                loss: "L",
                pend: "Pnd",
                dateND: "Date N/A",
                noGames: "No games found in this category for the selected date.",
                viewGames: "View games",
                disclaimerNotice: "Free informational platform in beta testing. Statistical picks do not guarantee profit. Gamble responsibly."
            },
            nep: {
                back: "पिक्समा फर्कनुहोस्",
                selDay: "छानिएको दिन:",
                today: "आज",
                loading: "लोड हुँदैछ...",
                statsNormais: "सामान्य बाजी (एकल)",
                statsFSAll: "Fighter Selected (सबै)",
                statsFSLow: "Low FS",
                statsFSMed: "Medium FS",
                statsFSHigh: "High FS",
                roiDay: "दैनिक ROI",
                roiMonth: "मासिक ROI",
                avgOdd: "औसत Odd",
                profitDay: "दैनिक नाफा (u)",
                results: "दैनिक नतिजा",
                resultsMonth: "मासिक नतिजा",
                win: "W",
                loss: "L",
                pend: "Pnd",
                dateND: "मिति N/A",
                noGames: "छानिएको दिनको लागि यो श्रेणीमा कुनै खेलहरू भेटिएन।",
                viewGames: "खेलहरू हेर्नुहोस्",
                disclaimerNotice: "निःशुल्क सूचनात्मक प्लेटफर्म। तथ्याङ्कीय विश्लेषणले नाफाको ग्यारेन्टी गर्दैन। जिम्मेवारीपूर्वक खेल्नुहोस्।"
            }
        };

        function detectarIdioma() {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang') || 
                       localStorage.getItem('idiomaPreferido') || 
                       localStorage.getItem('lang') || 
                       localStorage.getItem('idioma') || 'pt';
            return ['pt', 'en', 'nep'].includes(lang) ? lang : 'pt';
        }

        let currentLang = detectarIdioma();
        let t = i18n[currentLang];
        let dataSelecionada = hojeISO();
        let dadosJogosCache = {};

        function hojeISO() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }

        function atualizarIdioma(novoIdioma) {
            currentLang = novoIdioma;
            t = i18n[currentLang];
            localStorage.setItem('idiomaPreferido', novoIdioma);
            localStorage.setItem('lang', novoIdioma);
            document.documentElement.lang = novoIdioma;

            document.getElementById('txtVoltar').innerText = t.back;
            document.getElementById('txtDiaSel').innerText = t.selDay;
            document.getElementById('btnHoje').innerText = t.today;
            
            const discTextEl = document.getElementById('txtDisclaimerNotice');
            if (discTextEl) discTextEl.innerText = t.disclaimerNotice;
            
            renderizarEstatisticas(dadosJogosCache);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const selectLang = document.getElementById('seletorIdioma');
            if (selectLang) {
                selectLang.value = currentLang;
                selectLang.addEventListener('change', (e) => atualizarIdioma(e.target.value));
            }

            atualizarIdioma(currentLang);

            const inp = document.getElementById('datePicker');
            const btnHoje = document.getElementById('btnHoje');

            if (inp) {
                inp.value = dataSelecionada;
                inp.addEventListener('change', (e) => {
                    dataSelecionada = e.target.value || hojeISO();
                    renderizarEstatisticas(dadosJogosCache);
                });
            }
            if (btnHoje) {
                btnHoje.addEventListener('click', () => {
                    dataSelecionada = hojeISO();
                    if(inp) inp.value = dataSelecionada;
                    renderizarEstatisticas(dadosJogosCache);
                });
            }
        });

        // Escuta as configurações globais (Odd Mínima, Edge Mínimo e Discrepância da BD)
        onValue(ref(db, "config"), (snapshot) => {
            const config = snapshot.val() || {};
            if (config.minFsOdd !== undefined) window.minFsOdd = parseFloat(config.minFsOdd);
            else window.minFsOdd = 1.99;
            
            if (config.minFsEdge !== undefined) window.minFsEdge = parseFloat(config.minFsEdge);
            else window.minFsEdge = 0.10;

            if (config.minFsDiscrepancy !== undefined) window.minFsDiscrepancy = parseFloat(config.minFsDiscrepancy);
            else window.minFsDiscrepancy = 0.15;

            renderizarEstatisticas(dadosJogosCache);
        });

        // Escuta os jogos
        onValue(ref(db, "jogos"), (snapshot) => {
            dadosJogosCache = snapshot.val() || {};
            renderizarEstatisticas(dadosJogosCache);
        });

        function formatarDataDisplay(strData) {
            if(!strData) return t.dateND;
            const partes = strData.split('-');
            if(partes.length !== 3) return strData;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function testarValueBetSingular(selecao, percentagem, oddStr) {
            const o = parseFloat(oddStr);
            const limiteMinimoOdd = window.minFsOdd || 1.99;
            const limiteMinimoEdge = window.minFsEdge !== undefined ? window.minFsEdge : 0.10;

            if (isNaN(o) || o < limiteMinimoOdd) return null;
            
            const percDec = parseFloat(percentagem) / 100;
            if (isNaN(percDec) || percDec <= 0) return null;
            const probImplicita = 1 / o;
            const edge = percDec - probImplicita;
            
            if (edge >= limiteMinimoEdge) {
                let confianca = Math.min((edge * 2) * 100, 95);
                let cat = '';
                if (confianca >= 0.1 && confianca <= 15.99) cat = 'low';
                else if (confianca >= 16 && confianca <= 26.99) cat = 'medium';
                else if (confianca >= 27) cat = 'high';
                else cat = 'none';

                return { selecao: selecao.toUpperCase(), edge: edge, odd: o, cat: cat };
            }
            return null;
        }

        function extrairMelhorValueBet(r1, r2) {
            if (r1 && r2) return (r1.edge > r2.edge) ? r1 : r2;
            return r1 || r2 || null;
        }

        function calcularValueBetOculta(previsao, oddFormulario, pctV1, pctX, pctV2, oddV1, oddX, oddV2) {
            if (!previsao) return null;

            // NOVO: Aplicação do filtro do Factor de Discrepância
            const p1 = parseFloat(pctV1) || 0;
            const p2 = parseFloat(pctV2) || 0;
            const discrepancia = Math.abs(p1 - p2) / 100;
            const limiteMinimoDiscrepancy = window.minFsDiscrepancy !== undefined ? window.minFsDiscrepancy : 0.15;
            if (discrepancia < limiteMinimoDiscrepancy) return null;

            let p = previsao.toLowerCase().trim();
            let r1 = null, r2 = null;

            if (p === '1x' || p === 'v1x' || p === '1x2') {
                r1 = testarValueBetSingular('1', pctV1, oddV1);
                r2 = testarValueBetSingular('X', pctX, oddX);
                return extrairMelhorValueBet(r1, r2);
            } else if (p === '2x' || p === 'v2x' || p === 'x2') {
                r1 = testarValueBetSingular('2', pctV2, oddV2);
                r2 = testarValueBetSingular('X', pctX, oddX);
                return extrairMelhorValueBet(r1, r2);
            } else if (p === '12' || p === 'v12') {
                r1 = testarValueBetSingular('1', pctV1, oddV1);
                r2 = testarValueBetSingular('2', pctV2, oddV2);
                return extrairMelhorValueBet(r1, r2);
            }

            let percSelecionada = 0, selecaoFinal = p;
            if (p === '1' || p === 'v1') { percSelecionada = pctV1; selecaoFinal = '1'; }
            else if (p === 'x' || p === 'vx') { percSelecionada = pctX; selecaoFinal = 'X'; }
            else if (p === '2' || p === 'v2') { percSelecionada = pctV2; selecaoFinal = '2'; }

            if (percSelecionada > 0) return testarValueBetSingular(selecaoFinal, percSelecionada, oddFormulario);
            return null;
        }

        function avaliarResultadoFinal(selecao, gA, gB) {
            if (isNaN(gA) || isNaN(gB)) return 'pendente';
            if (selecao === '1') return gA > gB ? 'ganha' : 'perdida';
            if (selecao === 'X') return gA === gB ? 'ganha' : 'perdida';
            if (selecao === '2') return gA < gB ? 'ganha' : 'perdida';
            return 'pendente';
        }

        function renderizarEstatisticas(dadosJogos) {
            const container = document.getElementById('statsContainer');
            if(!container) return;
            document.getElementById('lblDataEscolhida').innerText = formatarDataDisplay(dataSelecionada);
            
            const anoMesSelecionado = dataSelecionada.substring(0, 7);
            const todosJogos = Object.values(dadosJogos).filter(j => j.arquivado);

            const s = {
                simples: { ganhas: 0, perdidas: 0, pendentes: 0, ganhasM: 0, perdidasM: 0, pendentesM: 0, lucro: 0, stake: 0, somaOdds: 0, lucroMensal: 0, stakeMensal: 0, jogosDia: [] },
                fs_all:  { ganhas: 0, perdidas: 0, pendentes: 0, ganhasM: 0, perdidasM: 0, pendentesM: 0, lucro: 0, stake: 0, somaOdds: 0, lucroMensal: 0, stakeMensal: 0, jogosDia: [] },
                fs_low:  { ganhas: 0, perdidas: 0, pendentes: 0, ganhasM: 0, perdidasM: 0, pendentesM: 0, lucro: 0, stake: 0, somaOdds: 0, lucroMensal: 0, stakeMensal: 0, jogosDia: [] },
                fs_medium:{ ganhas: 0, perdidas: 0, pendentes: 0, ganhasM: 0, perdidasM: 0, pendentesM: 0, lucro: 0, stake: 0, somaOdds: 0, lucroMensal: 0, stakeMensal: 0, jogosDia: [] },
                fs_high: { ganhas: 0, perdidas: 0, pendentes: 0, ganhasM: 0, perdidasM: 0, pendentesM: 0, lucro: 0, stake: 0, somaOdds: 0, lucroMensal: 0, stakeMensal: 0, jogosDia: [] }
            };

            todosJogos.forEach(j => {
                const isDaily = j.dataEvento === dataSelecionada;
                const isMonthly = j.dataEvento && j.dataEvento.startsWith(anoMesSelecionado);
                if (!isDaily && !isMonthly) return;

                const oddSimples = parseFloat(j.oddSimples || j.odd || 0);
                
                // Simples
                if (isDaily) {
                    s.simples.jogosDia.push({
                        equipaA: j.equipaA,
                        equipaB: j.equipaB,
                        liga: j.liga || '',
                        resA: j.resGolosA,
                        resB: j.resGolosB,
                        aposta: j.previsaoSimples || '-',
                        odd: oddSimples,
                        estado: j.estadoAposta || 'pendente'
                    });
                }

                if (j.estadoAposta === 'ganha') {
                    if (isDaily) { s.simples.ganhas++; s.simples.stake++; if(oddSimples>0) { s.simples.lucro += (oddSimples-1); s.simples.somaOdds += oddSimples; } }
                    if (isMonthly) { s.simples.ganhasM++; s.simples.stakeMensal++; if(oddSimples>0) s.simples.lucroMensal += (oddSimples-1); }
                } else if (j.estadoAposta === 'perdida') {
                    if (isDaily) { s.simples.perdidas++; s.simples.stake++; s.simples.lucro -= 1; if(oddSimples>0) s.simples.somaOdds += oddSimples; }
                    if (isMonthly) { s.simples.perdidasM++; s.simples.stakeMensal++; s.simples.lucroMensal -= 1; }
                } else {
                    if (isDaily) { s.simples.pendentes++; if(oddSimples>0) s.simples.somaOdds += oddSimples; }
                    if (isMonthly) { s.simples.pendentesM++; }
                }

                // Fighter Selection / Value Bet
                let vbS = calcularValueBetOculta(j.previsaoSimples, j.oddSimples, j.pctV1, j.pctX, j.pctV2, j.oddV1, j.oddX, j.oddV2);
                let vbSug = calcularValueBetOculta(j.previsaoSugestao, j.oddSugestao, j.pctV1, j.pctX, j.pctV2, j.oddV1, j.oddX, j.oddV2);
                let vb = vbSug || vbS;

                if (vb) {
                    let estadoVB = 'pendente';
                    if (j.estadoAposta === 'ganha' || j.estadoAposta === 'perdida') {
                        const gA = parseInt(j.resGolosA); const gB = parseInt(j.resGolosB);
                        if (!isNaN(gA) && !isNaN(gB)) {
                            estadoVB = avaliarResultadoFinal(vb.selecao, gA, gB);
                        } else {
                            estadoVB = j.estadoAposta;
                        }
                    }

                    const subCats = ['fs_all', `fs_${vb.cat}`];
                    
                    subCats.forEach(c => {
                        if(!s[c]) return;

                        if (isDaily) {
                            s[c].jogosDia.push({
                                equipaA: j.equipaA,
                                equipaB: j.equipaB,
                                liga: j.liga || '',
                                resA: j.resGolosA,
                                resB: j.resGolosB,
                                aposta: vb.selecao,
                                odd: vb.odd,
                                estado: estadoVB
                            });
                        }

                        if (estadoVB === 'ganha') {
                            if (isDaily) { s[c].ganhas++; s[c].stake++; s[c].lucro += (vb.odd-1); s[c].somaOdds += vb.odd; }
                            if (isMonthly) { s[c].ganhasM++; s[c].stakeMensal++; s[c].lucroMensal += (vb.odd-1); }
                        } else if (estadoVB === 'perdida') {
                            if (isDaily) { s[c].perdidas++; s[c].stake++; s[c].lucro -= 1; s[c].somaOdds += vb.odd; }
                            if (isMonthly) { s[c].perdidasM++; s[c].stakeMensal++; s[c].lucroMensal -= 1; }
                        } else {
                            if (isDaily) { s[c].pendentes++; s[c].somaOdds += vb.odd; }
                            if (isMonthly) { s[c].pendentesM++; }
                        }
                    });
                }
            });

            function gerarLinhaHTML(idCategory, title, color, statsObj) {
                const tot = statsObj.ganhas + statsObj.perdidas + statsObj.pendentes;
                const oddM = tot > 0 ? (statsObj.somaOdds / tot) : 0;
                const roi = statsObj.stake > 0 ? (statsObj.lucro / statsObj.stake) * 100 : 0;
                const roiM = statsObj.stakeMensal > 0 ? (statsObj.lucroMensal / statsObj.stakeMensal) * 100 : 0;
                
                const posD = statsObj.lucro >= 0; const posM = statsObj.lucroMensal >= 0;
                const corD = posD ? '#10b981' : '#ef4444'; const corM = posM ? '#10b981' : '#ef4444';

                let listaJogosHtml = '';
                if (statsObj.jogosDia.length === 0) {
                    listaJogosHtml = `<div class="empty-games">${t.noGames}</div>`;
                } else {
                    statsObj.jogosDia.forEach(jg => {
                        const resText = (jg.resA !== undefined && jg.resB !== undefined && jg.resA !== '' && jg.resB !== '') 
                            ? `${jg.resA} - ${jg.resB}` 
                            : 'vs';

                        let badgeClass = 'pend';
                        let statusSymbol = '⌛';
                        if (jg.estado === 'ganha') { badgeClass = 'win'; statusSymbol = '✓'; }
                        if (jg.estado === 'perdida') { badgeClass = 'loss'; statusSymbol = '✕'; }

                        listaJogosHtml += `
                            <div class="game-row-item">
                                <div class="game-info">
                                    <span class="game-teams"><b>${jg.equipaA}</b> <span class="score-pill">${resText}</span> <b>${jg.equipaB}</b></span>
                                    ${jg.liga ? `<span class="game-league">${jg.liga}</span>` : ''}
                                </div>
                                <div class="game-pick-details">
                                    <span class="pick-tag">${jg.aposta}</span>
                                    <span class="odd-tag">@${jg.odd.toFixed(2)}</span>
                                    <span class="status-badge ${badgeClass}">${statusSymbol}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                return `
                    <div class="stats-category-block" style="border-left: 5px solid ${color};">
                        <div class="block-header">
                            <h3 class="cat-title">
                                <span class="cat-dot" style="background: ${color};"></span>
                                ${title}
                                <span class="count-badge">${statsObj.jogosDia.length}</span>
                            </h3>
                        </div>
                        
                        <div class="stats-bar">
                            <div class="stat-card">
                                <div class="stat-label">${t.roiDay}</div>
                                <div class="stat-value" style="color:${corD}">${posD ? '▲' : '▼'} ${roi.toFixed(1)}%</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">${t.roiMonth}</div>
                                <div class="stat-value" style="color:${corM}">${posM ? '▲' : '▼'} ${roiM.toFixed(1)}%</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">${t.avgOdd}</div>
                                <div class="stat-value">@${oddM.toFixed(2)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">${t.profitDay}</div>
                                <div class="stat-value" style="color:${corD}">${posD ? '+' : ''}${statsObj.lucro.toFixed(2)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">${t.results}</div>
                                <div class="stat-value pills-wrapper">
                                    <span class="pill-res win">${statsObj.ganhas}${t.win}</span>
                                    <span class="pill-res loss">${statsObj.perdidas}${t.loss}</span>
                                    <span class="pill-res pend">${statsObj.pendentes}${t.pend}</span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">${t.resultsMonth}</div>
                                <div class="stat-value pills-wrapper">
                                    <span class="pill-res win">${statsObj.ganhasM}${t.win}</span>
                                    <span class="pill-res loss">${statsObj.perdidasM}${t.loss}</span>
                                    <span class="pill-res pend">${statsObj.pendentesM}${t.pend}</span>
                                </div>
                            </div>
                        </div>

                        <!-- LISTAGEM DE JOGOS EXPANSÍVEL -->
                        <details class="games-accordion">
                            <summary class="games-summary">
                                <span>${t.viewGames} (${statsObj.jogosDia.length})</span>
                                <span class="arrow-indicator">▼</span>
                            </summary>
                            <div class="games-dropdown-container">
                                ${listaJogosHtml}
                            </div>
                        </details>
                    </div>
                `;
            }

            container.innerHTML = `
                ${gerarLinhaHTML("normais", t.statsNormais, "#64748b", s.simples)}
                ${gerarLinhaHTML("fs_all", t.statsFSAll, "#3b82f6", s.fs_all)}
                ${gerarLinhaHTML("fs_low", t.statsFSLow, "#f97316", s.fs_low)}
                ${gerarLinhaHTML("fs_med", t.statsFSMed, "#eab308", s.fs_medium)}
                ${gerarLinhaHTML("fs_high", t.statsFSHigh, "#22c55e", s.fs_high)}
            `;
        }
    </script>

    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #1e293b; }
        
        .header-bar { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 16px 24px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .back-link { text-decoration: none; color: #475569; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
        .back-link:hover { color: #22c55e; }
        
        .page-title { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 900; color: #0f172a; margin: 0; }
        .page-title img { width: 24px; height: 24px; object-fit: contain; }
        
        .select-lang-header { border: 2px solid #e2e8f0; border-radius: 8px; padding: 6px 12px; font-weight: 700; color: #0f172a; background: #fff; cursor: pointer; outline: none; }
        .select-lang-header:focus { border-color: #22c55e; }

        /* Barra de Aviso Técnico / Disclaimer */
        .tech-disclaimer-bar {

            border-left: 4px solid #ef4444;
            border-radius: 12px;
            padding: 8px 14px;

            align-items: center;
            gap: 10px;

            font-size: 0.78rem;
            color: #7f1d1d;
            max-width: 1000px;
            margin: 0 auto 20px auto;
        }
        .tech-disclaimer-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            flex-shrink: 0;

            align-items: center;

            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;

        .date-controls-bar { display: flex; justify-content: space-between; align-items: center; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); max-width: 1000px; margin-left: auto; margin-right: auto; }

        .stats-category-block { background: #fff; border-radius: 12px; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.05); overflow: hidden; transition: all 0.2s ease; }

        .stat-value { font-size: 1.15rem; font-weight: 900; color: #0f172a; }
        
        .pills-wrapper { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
        .pill-res { font-size: 0.72rem; font-weight: 800; padding: 2px 6px; border-radius: 6px; color: white; }
        .pill-res.win { background: #10b981; }
        .pill-res.loss { background: #ef4444; }
        .pill-res.pend { background: #64748b; }

        /* PAINEL DE JOGOS EXPANSÍVEL (DENTRO DE CADA CATEGORIA) */
        .games-accordion { border-top: 1px solid #f1f5f9; }
        .games-summary { padding: 12px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; list-style: none; background-color: #fafafa; font-weight: 700; font-size: 0.85rem; color: #475569; transition: background-color 0.2s; }
        .games-summary::-webkit-details-marker { display: none; }
        .games-summary:hover { background-color: #f1f5f9; color: #0f172a; }

        .arrow-indicator { font-size: 0.75rem; color: #94a3b8; transition: transform 0.2s ease; }
        .games-accordion[open] .arrow-indicator { transform: rotate(180deg); }

        .games-dropdown-container { padding: 15px 20px; background: #fdfdfd; display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed #e2e8f0; }
        .empty-games { text-align: center; color: #94a3b8; font-size: 0.88rem; font-style: italic; padding: 10px 0; }

        .game-row-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; flex-wrap: wrap; gap: 10px; }
        .game-info { display: flex; flex-direction: column; gap: 2px; }
        .game-teams { color: #0f172a; font-size: 0.92rem; display: flex; align-items: center; gap: 6px; }
        .score-pill { background: #f1f5f9; padding: 2px 8px; border-radius: 4px; font-weight: bold; color: #0284c7; font-size: 0.85rem; border: 1px solid #cbd5e1; }
        .game-league { font-size: 0.72rem; color: #64748b; font-weight: 600; text-transform: uppercase; }

        .game-pick-details { display: flex; align-items: center; gap: 8px; }
        .pick-tag { background: #e0f2fe; color: #0369a1; font-weight: bold; padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; text-transform: uppercase; }
        .odd-tag { background: #f1f5f9; color: #334155; font-weight: 800; padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; font-family: monospace; border: 1px solid #e2e8f0; }
        
        .status-badge { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: white; }
        .status-badge.win { background: #10b981; }
        .status-badge.loss { background: #ef4444; }
        .status-badge.pend { background: #94a3b8; }

        @media (max-width: 900px) {
            .stats-bar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (max-width: 600px) {
            .stats-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .header-bar { flex-direction: column; gap: 12px; align-items: flex-start; }
            .date-controls-bar { flex-direction: column; gap: 12px; align-items: stretch; }
            .date-controls-right { justify-content: space-between; }
            .game-row-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .game-pick-details { width: 100%; justify-content: space-between; }
        }
    </style>
